{% extends "base.html" %}
{% block title %}Admin Login — {{ restaurant.name }}{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4" style="background:#0a0a0a;">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-accent/10 border-2 border-accent flex items-center justify-center mx-auto mb-4">
        <iconify-icon icon="solar:lock-password-linear" class="text-accent text-3xl"></iconify-icon>
      </div>
      <h1 class="font-forum text-2xl text-white uppercase tracking-wide">Admin Access</h1>
      <p class="text-neutral-500 text-sm mt-1">{{ restaurant.name }}</p>
    </div>
    <form method="POST" class="bg-[#111] border border-white/10 rounded-2xl p-8 space-y-5">
      <div>
        <label class="text-xs text-neutral-500 uppercase tracking-wide block mb-2">PIN Code</label>
        <input type="password" name="pin" maxlength="8" autofocus
          class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 text-white text-center text-2xl tracking-widest focus:border-accent outline-none transition"
          placeholder="••••">
      </div>
      {% if error %}
      <p class="text-red-400 text-sm text-center">{{ error }}</p>
      {% endif %}
      <button type="submit"
        class="w-full bg-accent hover:shadow-[0_0_20px_rgba(198,90,30,0.4)] transition duration-300 text-white py-3 rounded-xl font-medium">
        Enter Admin Panel
      </button>
    </form>
    <p class="text-center text-neutral-600 text-xs mt-6">Default PIN: 1234 — change via ADMIN_PIN environment variable</p>
    <div class="flex justify-center gap-4 mt-4 text-xs">
      <a href="/" class="text-neutral-500 hover:text-accent transition">Site</a>
      <a href="/pos" class="text-neutral-500 hover:text-accent transition">POS</a>
      <a href="/kitchen" class="text-neutral-500 hover:text-accent transition">Kitchen</a>
    </div>
  </div>
</div>
{% endblock %}
